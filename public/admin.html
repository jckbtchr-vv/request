<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - VV Request</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="hero">
    <h1>ADMIN</h1>
    <p style="color: var(--muted); margin-top: 1rem;">Manage submissions</p>
  </div>

  <div class="content">
    <div id="submissions" class="admin-grid"></div>

    <div class="nav-links">
      <a href="/" class="nav-link">SUBMIT REQUEST</a>
      <a href="/vote" class="nav-link">VOTE</a>
    </div>
  </div>

  <script>
    let editingId = null;

    async function loadSubmissions() {
      const res = await fetch('/api/submissions');
      const submissions = await res.json();
      const container = document.getElementById('submissions');

      if (submissions.length === 0) {
        container.innerHTML = '<div class="empty-state">No submissions yet.</div>';
        return;
      }

      container.innerHTML = submissions.map(s => `
        <div class="submission-card">
          <div class="submission-header">
            <div>
              <span class="status-badge status-${s.status}">${s.status.toUpperCase()}</span>
              <span style="margin-left: 1rem; color: var(--muted);">${s.votes} votes</span>
            </div>
            <div class="submission-meta">
              ${new Date(s.createdAt).toLocaleDateString()}
            </div>
          </div>

          <div class="submission-meta">
            @${escapeHtml(s.socialHandle)}
            ${s.email ? ` · ${escapeHtml(s.email)}` : ''}
          </div>

          <div class="submission-content">${escapeHtml(s.content)}</div>

          <div class="response-form" id="form-${s.id}">
            <div class="form-group">
              <label>STATUS</label>
              <select id="status-${s.id}">
                <option value="pending" ${s.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="approved" ${s.status === 'approved' ? 'selected' : ''}>Approved</option>
                <option value="completed" ${s.status === 'completed' ? 'selected' : ''}>Completed</option>
                <option value="rejected" ${s.status === 'rejected' ? 'selected' : ''}>Rejected</option>
              </select>
            </div>
            <div class="form-group">
              <label>NOTES</label>
              <input type="text" id="response-${s.id}" value="${escapeHtml(s.response || '')}" placeholder="admin notes...">
            </div>
            <div class="form-group">
              <label>RESPONSE URL</label>
              <input type="text" id="responseUrl-${s.id}" value="${escapeHtml(s.responseUrl || '')}" placeholder="link to completed visual...">
            </div>
            <button onclick="save('${s.id}')">SAVE</button>
          </div>
        </div>
      `).join('');
    }

    async function save(id) {
      const status = document.getElementById(`status-${id}`).value;
      const response = document.getElementById(`response-${id}`).value;
      const responseUrl = document.getElementById(`responseUrl-${id}`).value;

      const res = await fetch(`/api/submissions/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status, response, responseUrl })
      });

      if (res.ok) {
        loadSubmissions();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadSubmissions();
  </script>
</body>
</html>
